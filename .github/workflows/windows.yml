name: Windows
on:
  push:
    branches: [whatsmeow]
  pull_request:
    branches: [whatsmeow]

jobs:

  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.5' # I want latest, but I need to select some arbitrary version for installing the 32bit variant, see https://github.com/actions/setup-go/issues/347#issuecomment-1699466025
        architecture: x32

    - name: Install x86 GCC
      run: C:\msys64\usr\bin\pacman.exe --sync --needed --noconfirm mingw-w64-i686-gcc mingw-w64-i686-gcc

    - name: Add x86 GCC to PATH
      shell: pwsh
      run: echo "C:\msys64\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: vcpkg
      uses: johnwason/vcpkg-action@v6
      with:
        pkgs: opusfile
        triplet: 'x86-mingw-static'
        token: ${{ github.token }}

    - name: Configure
      run: cmake -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug -DVCPKG_TARGET_TRIPLET=x86-mingw-static -DVCPKG_MANIFEST_MODE=OFF -S . -B build -G "MSYS Makefiles"

    - name: Build
      run: cmake --build build

    - name: Strip
      run: strip -s build/glue/libwhatsmeow.dll

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        path: build/glue/libwhatsmeow.dll
        name: libwhatsmeow.dll
    
    - name: Create Release
      #if: contains(github.ref, 'tags/v')
      uses: ncipollo/release-action@v1
      with:
        artifacts: build/glue/libwhatsmeow.dll
        tag: nightly-${{ github.sha }}
        name: Nightly ${{ github.sha }}
        allowUpdates: true
        artifactErrorsFailBuild: true
